<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - ELTA</title>
  <style>
    :root { --bg: #f8f9fa; --text: #1a1a2e; --sub: #6b7280; --accent: #2563eb; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .wrap { text-align: center; }
    .code { font-size: 96px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 12px; }
    .msg { font-size: 20px; color: var(--sub); margin-bottom: 28px; }
    a { color: var(--accent); text-decoration: none; font-size: 16px; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="msg">页面不存在</div>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
