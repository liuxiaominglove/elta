# ELTA 官网 - autoelta.com (优化版)
# gzip压缩、请求限流、HSTS、规范重定向
#
# 部署位置：/etc/nginx/conf.d/elta.conf（腾讯云服务器 root@106.53.167.38）
# 本文件是服务器配置的版本管理留档（deploy.sh 之外手动维护的 nginx 配置）。
# 修改后同步到服务器：scp 本文件到 /etc/nginx/conf.d/elta.conf && systemctl reload nginx

# ===== 全局 Gzip 压缩 =====
gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

# ===== 请求限流（每 IP 每秒最多 10 请求） =====
limit_req_zone $binary_remote_addr zone=elta_limit:10m rate=10r/s;

# ===== HTTP -> HTTPS 重定向 =====
server {
    listen 80;
    server_name autoelta.com www.autoelta.com;
    return 301 https://$host$request_uri;
}

# ===== HTTPS 主站 =====
server {
    server_name autoelta.com www.autoelta.com;

    root /var/www/elta-website;
    index index.html;

    # 日志
    access_log /var/log/nginx/elta-access.log;
    error_log /var/log/nginx/elta-error.log;

    # 请求限流（突发允许多 20 个请求）
    limit_req zone=elta_limit burst=20 nodelay;

    # Clean URL: /docs -> /docs.html
    location / {
        try_files $uri $uri.html $uri/ =404;
        # HTML 不缓存：每次重新校验，保证下载按钮总是最新版本链接（版本化 DMG 才走下面的 immutable 强缓存）
        expires -1;
    }
    # DMG 国内直链下载（独立目录，不受 rsync --delete 影响）
    location /download/ {
        alias /var/www/elta-downloads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /download/latest.dmg {
        alias /var/www/elta-downloads/latest.dmg;
        add_header Cache-Control "no-cache";
    }


    # API 路由（使用统计 + 更新检查）
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /admin {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt / sitemap.xml 短期缓存
    location = /robots.txt {
        expires 1d;
    }
    location = /sitemap.xml {
        expires 1d;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS（半年有效期，浏览器强制 HTTPS）
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/autoelta.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/autoelta.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
