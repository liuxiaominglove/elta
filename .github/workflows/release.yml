name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p build
        shell: bash
      
      - name: Build x86_64
        run: |
          swiftc -target x86_64-apple-macosx13.0 \
            -o build/ELTA.x86_64 \
            Sources/*.swift \
            -framework Cocoa -framework Carbon -framework WebKit -framework Vision -framework UserNotifications \
            -O -whole-module-optimization
        shell: bash
      
      - name: Build arm64
        run: |
          swiftc -target arm64-apple-macosx13.0 \
            -o build/ELTA.arm64 \
            Sources/*.swift \
            -framework Cocoa -framework Carbon -framework WebKit -framework Vision -framework UserNotifications \
            -O -whole-module-optimization
        shell: bash
      
      - name: Create Universal Binary
        run: |
          lipo -create build/ELTA.x86_64 build/ELTA.arm64 -output build/ELTA
          echo "Architectures: $(lipo -archs build/ELTA)"
          echo "Size: $(du -h build/ELTA | cut -f1)"
        shell: bash
      
      - name: Package .app Bundle
        run: |
          mkdir -p build/ELTA.app/Contents/MacOS
          mkdir -p build/ELTA.app/Contents/Resources
          cp build/ELTA build/ELTA.app/Contents/MacOS/
          cp Resources/Info.plist build/ELTA.app/Contents/
          echo -n "APPL????" > build/ELTA.app/Contents/PkgInfo
          if [ -f Resources/AppIcon.icns ]; then
            cp Resources/AppIcon.icns build/ELTA.app/Contents/Resources/
          fi
        shell: bash

      - name: Import Developer ID certificate
        run: |
          echo "${{ secrets.DEVELOPER_ID_CERT }}" | base64 --decode > /tmp/DeveloperID.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/DeveloperID.p12 -k build.keychain -P "${{ secrets.CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
        shell: bash

      - name: Sign app (Hardened Runtime)
        run: |
          codesign --force --options runtime \
            --sign "${{ secrets.DEVELOPER_ID_NAME }}" \
            --entitlements Resources/ELTA.entitlements \
            build/ELTA.app
        shell: bash

      - name: Install create-dmg
        run: npm install -g create-dmg
        shell: bash

      - name: Create DMG
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          bash scripts/package-dmg.sh "$APP_VERSION" build build/ELTA.app
        shell: bash

      - name: Sign DMG
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          codesign --force --sign "${{ secrets.DEVELOPER_ID_NAME }}" "build/ELTA.v${APP_VERSION}.dmg"
        shell: bash

      - name: Notarize DMG
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "${{ secrets.NOTARY_KEY }}" > /tmp/AuthKey.p8
          xcrun notarytool submit "build/ELTA.v${APP_VERSION}.dmg" \
            --key /tmp/AuthKey.p8 \
            --key-id "${{ secrets.NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.NOTARY_ISSUER_ID }}" \
            --wait
        shell: bash

      - name: Staple DMG
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          xcrun stapler staple "build/ELTA.v${APP_VERSION}.dmg"
          xcrun stapler validate "build/ELTA.v${APP_VERSION}.dmg"
        shell: bash
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
