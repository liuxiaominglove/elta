name: Windows Release

# 形态 A：独立发布通道（与 macOS 的 v* 解耦，避免撞名）
# - 触发：push tag `win-v*`（如 win-v1.0.0）；或手动 workflow_dispatch 试跑
# - 版本闸机：tag 版本 == Elta.Windows.csproj <Version>（由打包脚本经 ReleaseGate 校验；每平台自有版本线，不比 mac plist）
# - 产物：windows/dist/ELTA-Windows-vX.Y.Z-win-x64-single.zip + .sha256，挂到对应 GitHub Release
# - CI 跳过需 GUI/API Key 的翻译冒烟（-SkipSmoke）；"发布前真机门禁"保留在本机

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack (single, CI=SkipSmoke)
        shell: pwsh
        env:
          # tag 触发时为 `win-vX.Y.Z`；手动 dispatch 时为空（跳过闸机）
          EXPECTED_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          $ev = "$env:EXPECTED_VERSION" -replace '^win-v', ''
          Write-Host "expected version = '$ev'"
          powershell -NoProfile -ExecutionPolicy Bypass -File windows/pack-release-windows.ps1 -Flavor single -SkipSmoke -ExpectedVersion "$ev"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/dist/*.zip
            windows/dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
